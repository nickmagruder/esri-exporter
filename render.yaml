# NOTE (2026-11-16): The live Render services ("esri-exporter" and "esri-exporter-web")
# were created in the dashboard, not from this Blueprint. Render therefore does NOT
# apply this file: the env vars below (PYTHON_VERSION, NODE_VERSION, FLASK_DEBUG) are not
# set on the live services. Set them in the dashboard (or use backend/.python-version).
# The static site esri-exporter-web auto-deploys on commit (enabled in the dashboard 2026-11-16).
# This file is kept as the reference configuration.
services:
  # Flask backend API
  - type: web
    runtime: python
    name: esri-exporter-api
    rootDir: ./backend
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --bind 0.0.0.0:$PORT app:app
    envVars:
      - key: PYTHON_VERSION
        value: "3.14.3"
      - key: FLASK_DEBUG
        value: "false"

  # React/Vite frontend static site
  - type: web
    runtime: static
    name: esri-exporter-frontend
    rootDir: ./frontend
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    envVars:
      - key: NODE_VERSION
        value: "24"
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    # NOTE: After deploying, add a rewrite rule in the Render Dashboard:
    #   Source: /api/*
    #   Destination: https://esri-exporter.onrender.com/api/*
    # This proxies frontend API calls to the backend service.
    # Dashboard rewrites take priority over render.yaml routes.
