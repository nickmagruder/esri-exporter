# Ruff's classic default rules (pyflakes and the error-level pycodestyle
# checks), plus flake8-bugbear (B) for likely bugs such as raising inside an
# except without `from`. Wider rule sets, and `ruff format`, are a separate
# decision.
target-version = "py314"

[lint]
select = ["E4", "E7", "E9", "F", "B"]
