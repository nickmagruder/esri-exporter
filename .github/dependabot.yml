version: 2
updates:
  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    # Wait out compromised fresh releases (e.g. Shai-Hulud) before proposing them.
    cooldown:
      default-days: 3
    # TypeScript 7 is deferred (AGENTS.md: typescript-eslint can't run on it
    # yet). Remove this when the upgrade is planned.
    ignore:
      - dependency-name: typescript
        update-types: ['version-update:semver-major']
    groups:
      # Patch-only dev group: the one kind of PR that auto-merges
      # (.github/workflows/dependabot-auto-merge.yml).
      dev-patch:
        dependency-type: development
        update-types: [patch]
      dev-minor:
        dependency-type: development
        update-types: [minor]
      dependencies:
        dependency-type: production
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 3
    groups:
      repo-tooling:
        patterns: ['*']
        update-types: [minor, patch]

  - package-ecosystem: pip
    directory: /backend
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 3
    groups:
      python:
        patterns: ['*']
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 3
    groups:
      actions:
        patterns: ['*']
