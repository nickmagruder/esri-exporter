name: dependabot-auto-merge

# Turns on auto-merge for Dependabot PRs that only bump devDependencies by a
# patch version (the dev-patch group). It runs its own dependency review
# first, since only `check` is a required status check: a patch that adds a
# high or critical advisory never gets auto-merge. The ruleset's required
# `check` job still has to pass before GitHub merges. Everything else waits
# for Nick (clankers standards/git.md: auto-merge is for dev patches only).
#
# A merge made by GITHUB_TOKEN starts no workflow runs, so an auto-merged
# commit gets no `check` or CodeQL run on main until the next push. Render
# deploys from its own GitHub integration, so it does deploy: frontend dev
# patches (Vite, Tailwind, ESLint) rebuild the static site.

'on': pull_request

permissions:
  contents: read

jobs:
  auto-merge:
    runs-on: ubuntu-latest
    if: github.event.pull_request.user.login == 'dependabot[bot]' && github.repository == 'nickmagruder/esri-exporter'
    permissions:
      contents: write # merge
      pull-requests: write # enable auto-merge
    steps:
      - id: meta
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Fails this job (so auto-merge stays off) on a high or critical advisory.
      - uses: actions/dependency-review-action@bbc44d14a204704ccc493733616cd1e93a0321ec # v5.0.1
        with:
          fail-on-severity: high

      - name: Enable auto-merge for devDependency patches
        env:
          DEPS: ${{ steps.meta.outputs.updated-dependencies-json }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          eligible=$(node -e '
            const deps = JSON.parse(process.env.DEPS || "[]");
            const ok = deps.length > 0 && deps.every(
              (d) => d.updateType === "version-update:semver-patch" && d.dependencyType === "direct:development");
            process.stdout.write(ok ? "yes" : "no");
          ')
          if [ "$eligible" = "yes" ]; then
            gh pr merge --auto --squash "$PR_URL"
          else
            echo "Not a devDependency-only patch update; leaving it for review."
          fi
